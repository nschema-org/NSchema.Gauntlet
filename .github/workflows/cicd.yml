name: NSchema.Gauntlet

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  gauntlet:
    name: Gauntlet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check out build pipeline
        uses: actions/checkout@v7
        with:
          repository: 'nschema-org/NSchema.Build'
          path: 'build'

      - name: Restore tools
        run: dotnet tool restore
        shell: bash

      - name: Run Verify Pipeline
        run: dotnet run --project build/src/NSchema.Build/NSchema.Build.csproj -- verify
        shell: bash
        env:
          Build__ProjectFile: 'tests/NSchema.Gauntlet/NSchema.Gauntlet.csproj'

      - name: Upload received snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: received-snapshots
          path: '**/*.received.*'
          if-no-files-found: ignore
